<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Áreas</title>
    <link rel="stylesheet" href="color.css">
</head>

<body>
    <h1>Selecciona una figura:</h1>
    <div class="figuras">
        <div class="figura" onclick="mostrarFormulario('cuadrado')">
            <img src="cuadrado.jpg" alt="Cuadrado">
            <h2>Cuadrado</h2>
        </div>
        <div class="figura" onclick="mostrarFormulario('rectangulo')">
            <img src="rectangulo.jpg" alt="Rectángulo">
            <h2>Rectángulo</h2>
        </div>
        <div class="figura" onclick="mostrarFormulario('triangulo')">
            <img src="triangulo.jpg" alt="Triángulo">
            <h2>Triángulo</h2>
        </div>
        <div class="figura" onclick="mostrarFormulario('circulo')">
            <img src="circulo.jpg" alt="Círculo">
            <h2>Círculo</h2>
        </div>
    </div>

    <div id="form-cuadrado" class="formulario">
        <h2>Área del Cuadrado</h2>
        <label for="lado">Lado:</label>
        <input type="number" id="lado" placeholder="Introduce el lado">
        <button onclick="calcularAreaCuadrado()">Calcular área</button>
    </div>

    <div id="form-rectangulo" class="formulario">
        <h2>Área del Rectángulo</h2>
        <label for="baseRectangulo">Base:</label>
        <input type="number" id="baseRectangulo" placeholder="Introduce la base">
        <label for="alturaRectangulo">Altura:</label>
        <input type="number" id="alturaRectangulo" placeholder="Introduce la altura">
        <button onclick="calcularAreaRectangulo()">Calcular área</button>
    </div>

    <div id="form-triangulo" class="formulario">
        <h2>Área del Triángulo</h2>
        <label for="baseTriangulo">Base:</label>
        <input type="number" id="baseTriangulo" placeholder="Introduce la base">
        <label for="alturaTriangulo">Altura:</label>
        <input type="number" id="alturaTriangulo" placeholder="Introduce la altura">
        <button onclick="calcularAreaTriangulo()">Calcular área</button>
    </div>

    <div id="form-circulo" class="formulario">
        <h2>Área del Círculo</h2>
        <label for="radio">Radio:</label>
        <input type="number" id="radio" placeholder="Introduce el radio">
        <button onclick="calcularAreaCirculo()">Calcular área</button>
    </div>

    <div id="resultado"></div>
    <script src="script.js"></script>
</body>

</html>
